  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

    h1 span { display:block; color:transparent; -webkit-text-stroke:1px rgba(230,242,255,.7); }
    .lede { max-width:320px; margin:20px 0 0; color:#a6b0c9; line-height:1.65; font-size:13px; }

    .model:hover, .model.active { border-color:rgba(124,245,255,.62); background:rgba(65,229,255,.11); color:#efffff; box-shadow:inset 0 0 20px rgba(78,212,255,.06); }
    .model b { font-size:11px; display:block; font-weight:600; }.model small { font-family:'DM Mono',monospace; font-size:8px; opacity:.6; letter-spacing:.09em; }

    .webcam { display:none; position:fixed; z-index:2; right:27px; bottom:27px; width:144px; aspect-ratio:4/3; object-fit:cover; transform:scaleX(-1); border-radius:12px; border:1px solid rgba(124,245,255,.4); box-shadow:0 0 30px rgba(73,191,255,.18); opacity:.78; }
    .webcam.on { display:block; }.handcanvas { display:none; }
    @media(max-width:700px) { .top{padding:20px}.headline{left:20px;top:29%;}.controls{right:15px;top:auto;bottom:14px;transform:none;width:calc(100% - 30px);max-height:48vh;overflow-y:auto;padding:14px}.model-grid{grid-template-columns:repeat(4,1fr);}.model small{display:none}.model{padding:8px 5px}.gesture-card,.hint{display:none}.webcam.on{display:block!important;right:14px;top:16px;bottom:auto;width:126px;opacity:.92}.lede{font-size:12px;width:230px}.field{display:block}.camera{display:block} }

<body>
  <section id="loginGate" aria-label="网站登录">
    <form class="login-card" id="loginForm">
      <div class="login-orbit">✦</div><p class="mono">GESTURA / PRIVATE ACCESS</p><h2>进入粒子宇宙</h2>
      <p>请输入访问凭据，解锁手势驱动的互动体验。</p>
      <label for="loginUser">用户名</label><input id="loginUser" autocomplete="username" required />
      <label for="loginPass">密码</label><input id="loginPass" type="password" autocomplete="current-password" required />
      <button type="submit">进入体验</button><div class="login-error" id="loginError" role="alert"></div>
    </form>
  </section>
  <main id="stage" aria-label="GESTURA interactive particle universe"></main><div class="grain"></div>
  <section class="top"><div><div class="brand"><i class="brand-mark"></i>GESTURA / 01</div><div class="subtitle">手势驱动粒子宇宙</div></div><div class="status"><i class="pulse"></i><span id="systemStatus">鼠标控制</span></div></section>
  <section class="headline"><p class="mono">交互式宇宙形态</p><h1>让不可见<br><span>化为可触。</span></h1><p class="lede">挥动手掌，塑造光粒子的引力。张合控制收缩，手部位移改变宇宙模型的旋转方向。</p></section>
  <aside class="controls" aria-label="粒子控制面板">
    <header><h2>形态实验室</h2><span class="mono" id="countTag">24K 粒子</span></header>
    <div class="model-grid">
      <button class="model active" data-model="orbital"><b>轨道</b><small>01 / 光环</small></button><button class="model" data-model="nova"><b>新星</b><small>02 / 星核</small></button>
      <button class="model" data-model="firework"><b>烟花</b><small>03 / 绽放</small></button><button class="model" data-model="butterfly"><b>羽翼</b><small>04 / 波形</small></button>
    </div>
    <div class="field"><div class="field-label"><span>粒子密度</span><output id="densityOut">24,000</output></div><input id="density" type="range" min="4000" max="40000" value="24000" step="1000" /></div>
    <div class="field"><div class="field-label"><span>基础颜色</span><output id="colorOut">青蓝</output></div><input id="baseColor" type="color" value="#5beaff" /></div>
    <div class="field"><div class="field-label"><span>光辉强度</span><output id="glowOut">92%</output></div><input id="glow" type="range" min="20" max="100" value="92" /></div>
    <button id="cameraBtn" class="camera">启用摄像头手势控制</button>
  </aside>
  <section class="gesture-card"><div class="gesture-icon" id="gestureIcon">✦</div><div class="gesture-text"><strong id="gestureName">自由漫游</strong><span id="gestureDetail">移动鼠标旋转 · 按住收缩</span></div></section>
  <p class="hint">手掌展开 = 释放 &nbsp; / &nbsp; 手掌收合 = 聚拢</p><video class="webcam" id="webcam" playsinline muted></video><canvas class="handcanvas" id="handcanvas"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script>
  (() => {
    const loginGate=document.getElementById('loginGate'),loginForm=document.getElementById('loginForm'),loginError=document.getElementById('loginError');
    async function digest(text){const data=new TextEncoder().encode(text),hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(v=>v.toString(16).padStart(2,'0')).join('')}
    if(sessionStorage.getItem('gestura-access')==='ok')loginGate.classList.add('done');
    loginForm.addEventListener('submit',async event=>{event.preventDefault();const user=document.getElementById('loginUser').value.trim(),pass=document.getElementById('loginPass').value;if(await digest(`${user}:${pass}`)==='cfddc140181a6316e2d48d7570bca9cc17a901190875e78fb6f9d68c4f70d075'){sessionStorage.setItem('gestura-access','ok');loginGate.classList.add('done')}else loginError.textContent='用户名或密码不正确，请重试。'});
    const stage = document.getElementById('stage');
    const mobileMode = matchMedia('(pointer:coarse)').matches && (navigator.maxTouchPoints > 0 || Math.min(innerWidth,innerHeight) < 900);
    const mobileParticleCap = 10000;
    const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,mobileMode?1.25:2)); renderer.setSize(innerWidth,innerHeight); renderer.setClearColor(0x03030a,1); renderer.outputColorSpace = THREE.SRGBColorSpace; stage.appendChild(renderer.domElement);
    const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x03030a,.035); const camera = new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100); camera.position.set(0,0,6.15);
    const group = new THREE.Group(); group.scale.setScalar(1.35); scene.add(group);
    const pointV = `attribute float size; attribute float seed; varying vec3 vColor; varying float vSeed; void main(){vColor=color;vSeed=seed;vec4 mvPosition=modelViewMatrix*vec4(position,1.);gl_PointSize=size*(190./-mvPosition.z);gl_Position=projectionMatrix*mvPosition;}`;
    const pointF = `uniform float glow; varying vec3 vColor; varying float vSeed; void main(){vec2 uv=gl_PointCoord-.5;float d=length(uv);float core=smoothstep(.46,.06,d);float halo=smoothstep(.7,.08,d)*.28;float twinkle=.78+.22*sin(vSeed*42.);gl_FragColor=vec4(vColor*(core+halo*glow)*twinkle,(core+halo)*.96);}`;
    let positions, bases, colors, sizes, seeds, geometry, particles, count=mobileMode?8000:24000, baseHue=.53, hueBoost=.0, glow=.92, rotationTarget={x:0,y:0}, closed=false, gestureSpread=1, handGestureActive=false, tick=0, handAnchor=null, handSmooth={x:.5,y:.5}, activeModel='orbital';
    const material = new THREE.ShaderMaterial({vertexShader:pointV,fragmentShader:pointF,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,uniforms:{glow:{value:glow}}});
    const rand = (a=1)=> (Math.random()-.5)*a; const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
    function generateModel(kind,n){ const out=new Float32Array(n*3),tau=Math.PI*2; for(let i=0;i<n;i++){let x,y,z,t=Math.random()*tau,r,p=Math.random();
      if(kind==='orbital'){let layer=i%6;if(p<.2){r=Math.pow(Math.random(),.42)*.8;let a=Math.random()*tau,b=Math.acos(rand(2));x=r*Math.sin(b)*Math.cos(a);y=r*Math.cos(b);z=r*Math.sin(b)*Math.sin(a)}else{r=1.18+layer*.27+rand(.16);let tilt=(layer-2.5)*.17;x=Math.cos(t)*r;z=Math.sin(t)*r*(.32+layer*.035);y=Math.sin(t*2+layer)*.11+Math.sin(t)*tilt;if(layer===5){x*=.76;y+=Math.sin(t)*1.1;z*=.76}} }
      if(kind==='nova'){let arm=i%5,progress=Math.pow(Math.random(),.54),a=arm*tau/5+progress*5.35+rand(.27);r=.12+progress*3.35;x=Math.cos(a)*r;y=Math.sin(a)*r*.67;z=rand(.68)*(1-progress*.55);if(p<.13){r=Math.pow(Math.random(),.32)*.95;x=rand(r);y=rand(r);z=rand(r)} }
      if(kind==='firework'){let beam=i%42,a=beam*tau/42+rand(.12),reach=.18+Math.pow(Math.random(),.46)*3.3; x=Math.cos(a)*reach;y=Math.sin(a)*reach;z=rand(.62)*(1-reach/4);if(p<.2){let rr=Math.pow(Math.random(),.42)*.86,aa=Math.random()*tau,bb=Math.acos(rand(2));x=rr*Math.sin(bb)*Math.cos(aa);y=rr*Math.cos(bb);z=rr*Math.sin(bb)*Math.sin(aa)} }
      if(kind==='butterfly'){let side=Math.random()<.5?-1:1,q=Math.random()*tau,rr=Math.pow(Math.random(),.56)*2.45,edge=.6+.42*Math.cos(q*2);x=side*(.22+rr*edge);y=Math.sin(q)*rr*.76;z=Math.cos(q*3)*.52+rand(.21);if(p<.17){x=rand(.15);y=rand(2.9);z=rand(.24)} }
      out[i*3]=x;out[i*3+1]=y;out[i*3+2]=z; } return out; }
    function makeParticles(kind='orbital') { if(particles) {group.remove(particles); geometry.dispose();} activeModel=kind;bases=generateModel(kind,count); positions=new Float32Array(count*3); colors=new Float32Array(count*3); sizes=new Float32Array(count); seeds=new Float32Array(count); for(let i=0;i<count;i++){positions[i*3]=rand(12);positions[i*3+1]=rand(8);positions[i*3+2]=rand(8);sizes[i]=(kind==='firework'?.033:.022)+Math.random()*(kind==='firework'?.064:.042);seeds[i]=Math.random();} geometry=new THREE.BufferGeometry(); geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));geometry.setAttribute('size',new THREE.BufferAttribute(sizes,1));geometry.setAttribute('seed',new THREE.BufferAttribute(seeds,1)); particles=new THREE.Points(geometry,material);group.add(particles);refreshColors(); }
    function refreshColors(){if(!colors)return; const c=new THREE.Color(),fireHues=[.02,.10,.48,.57,.78,.9];let spin=group.rotation.y*.08; for(let i=0;i<count;i++){let h=activeModel==='firework'?fireHues[Math.floor(seeds[i]*fireHues.length)]+spin*.35:(baseHue+spin+hueBoost+seeds[i]*.12);c.setHSL((h+1)%1,.94,.63+seeds[i]*.18);colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;} geometry.attributes.color.needsUpdate=true;}
    const bgGeo=new THREE.BufferGeometry(), bgCount=2400, bg=new Float32Array(bgCount*3), bgCol=new Float32Array(bgCount*3);for(let i=0;i<bgCount;i++){let r=13+Math.random()*28,th=Math.random()*6.28,ph=Math.acos(rand(2));bg[i*3]=r*Math.sin(ph)*Math.cos(th);bg[i*3+1]=r*Math.cos(ph);bg[i*3+2]=r*Math.sin(ph)*Math.sin(th);let c=new THREE.Color().setHSL(.57+Math.random()*.18,.7,.55);bgCol.set([c.r,c.g,c.b],i*3)}bgGeo.setAttribute('position',new THREE.BufferAttribute(bg,3));bgGeo.setAttribute('color',new THREE.BufferAttribute(bgCol,3));const bgMat=new THREE.PointsMaterial({size:.021,vertexColors:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});const background=new THREE.Points(bgGeo,bgMat);scene.add(background);
    const fireworks=[], fireworkHues=[.02,.10,.48,.57,.78,.9]; let lastBurst=0, pointingSince=0, cameraStartedAt=0;
    function spawnFirework(sx,sy){const amount=220,origin=new THREE.Vector3((sx-.5)*2,-(sy-.5)*2,.12).unproject(camera).sub(camera.position).normalize().multiplyScalar(5.2).add(camera.position),pos=new Float32Array(amount*3),vel=new Float32Array(amount*3),col=new Float32Array(amount*3),c=new THREE.Color(),h=fireworkHues[Math.floor(Math.random()*fireworkHues.length)];for(let i=0;i<amount;i++){let a=Math.random()*Math.PI*2,b=Math.acos(rand(2)),speed=.024+Math.pow(Math.random(),.43)*.105;vel[i*3]=Math.sin(b)*Math.cos(a)*speed;vel[i*3+1]=Math.cos(b)*speed;vel[i*3+2]=Math.sin(b)*Math.sin(a)*speed;pos[i*3]=origin.x;pos[i*3+1]=origin.y;pos[i*3+2]=origin.z;c.setHSL((h+rand(.09)+1)%1,.95,.62+Math.random()*.2);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));const mat=new THREE.PointsMaterial({size:.065,vertexColors:true,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});const points=new THREE.Points(geo,mat);scene.add(points);fireworks.push({points,geo,mat,pos,vel,age:0,duration:1.5});}
    function updateFireworks(){for(let f=fireworks.length-1;f>=0;f--){const fw=fireworks[f];fw.age+=.016;for(let i=0;i<fw.vel.length;i+=3){fw.vel[i+1]-=.0017;fw.vel[i]*=.989;fw.vel[i+1]*=.989;fw.vel[i+2]*=.989;fw.pos[i]+=fw.vel[i];fw.pos[i+1]+=fw.vel[i+1];fw.pos[i+2]+=fw.vel[i+2]}fw.geo.attributes.position.needsUpdate=true;fw.mat.opacity=Math.max(0,1-fw.age/fw.duration);fw.mat.size=.065*(1-fw.age/fw.duration*.55);if(fw.age>fw.duration){scene.remove(fw.points);fw.geo.dispose();fw.mat.dispose();fireworks.splice(f,1)}}}
    function setGesture(name,detail,icon){document.getElementById('gestureName').textContent=name;document.getElementById('gestureDetail').textContent=detail;document.getElementById('gestureIcon').textContent=icon;}
    function render(){requestAnimationFrame(render);tick++;group.rotation.x+=(rotationTarget.x-group.rotation.x)*.05;group.rotation.y+=(rotationTarget.y-group.rotation.y)*.05; background.rotation.y+=.00017;background.rotation.x+=.00006;let spread=handGestureActive?gestureSpread:(closed?0:1),scale=.24+1.26*spread,speed=.05+(1-spread)*.112;for(let i=0;i<count;i++){let k=i*3,pulse=activeModel==='firework'?1+Math.sin(tick*.045+seeds[i]*18)*.035:1,bx=bases[k]*scale*pulse,by=bases[k+1]*scale*pulse,bz=bases[k+2]*scale*pulse;positions[k]+=(bx-positions[k])*speed;positions[k+1]+=(by-positions[k+1])*speed;positions[k+2]+=(bz-positions[k+2])*speed;}geometry.attributes.position.needsUpdate=true;updateFireworks();if(tick%8===0)refreshColors();renderer.render(scene,camera)}
    function setPointer(x,y,fromHand=false){if(!fromHand){rotationTarget.y=(x-.5)*2.7;rotationTarget.x=(y-.5)*1.55;return}handSmooth.x+=(x-handSmooth.x)*.5;handSmooth.y+=(y-handSmooth.y)*.5;if(!handAnchor){handAnchor={x:handSmooth.x,y:handSmooth.y};return}let dx=handSmooth.x-handAnchor.x,dy=handSmooth.y-handAnchor.y;if(Math.abs(dx)+Math.abs(dy)>.001){rotationTarget.y+=dx*12.5;rotationTarget.x+=dy*9.4;handAnchor={x:handSmooth.x,y:handSmooth.y};}}
    stage.addEventListener('pointermove',e=>setPointer(e.clientX/innerWidth,e.clientY/innerHeight)); stage.addEventListener('pointerdown',()=>{closed=true;setGesture('粒子收缩','松开以释放能量','✦')}); stage.addEventListener('pointerup',()=>{closed=false;setGesture('自由漫游','移动鼠标旋转 · 按住收缩','✦')});
    document.querySelectorAll('.model').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.model.active').classList.remove('active');b.classList.add('active');makeParticles(b.dataset.model)}));
    const density=document.getElementById('density');function updateDensityLabel(){document.getElementById('densityOut').textContent=Number(density.value).toLocaleString();document.getElementById('countTag').textContent=(density.value/1000)+'K 粒子';}if(mobileMode){density.max=mobileParticleCap;density.value=count;updateDensityLabel();}density.addEventListener('input',updateDensityLabel);density.addEventListener('change',()=>{count=Math.min(+density.value,mobileMode?mobileParticleCap:40000);makeParticles(document.querySelector('.model.active').dataset.model)});
    document.getElementById('baseColor').addEventListener('input',e=>{const c=new THREE.Color(e.target.value);const hsl={};c.getHSL(hsl);baseHue=hsl.h;document.getElementById('colorOut').textContent=e.target.value.toUpperCase();});document.getElementById('glow').addEventListener('input',e=>{glow=e.target.value/100;material.uniforms.glow.value=glow;document.getElementById('glowOut').textContent=e.target.value+'%'});
    const video=document.getElementById('webcam'),cameraBtn=document.getElementById('cameraBtn'); let hands, cameraLoop;
    async function startCamera(){try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:mobileMode?640:720},height:{ideal:mobileMode?480:540}},audio:false});video.srcObject=stream;await video.play();video.classList.add('on');handAnchor=null;handSmooth={x:.5,y:.5};cameraStartedAt=performance.now();document.getElementById('systemStatus').textContent=mobileMode?'手机识别模式已启动':'正在识别手势';cameraBtn.textContent='摄像头手势已启用';cameraBtn.disabled=true;setGesture('正在寻找手掌',mobileMode?'让整只手进入右上角小窗，手心朝镜头':'手心朝向镜头，整只手放入右下角画面','⌁');hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:mobileMode?1:2,modelComplexity:mobileMode?0:1,minDetectionConfidence:mobileMode?.2:.12,minTrackingConfidence:mobileMode?.2:.12});hands.onResults(results=>{const lm=results.multiHandLandmarks&&results.multiHandLandmarks[0],now=performance.now();if(!lm){handGestureActive=false;handAnchor=null;pointingSince=0;if(now-cameraStartedAt>1200)setGesture('正在寻找手掌',mobileMode?'请把整只手放进右上角小窗，距离镜头 35–60 厘米':'请靠近镜头 40–70 厘米，并让手心完整可见','⌁');return}const wrist=lm[0],palm=Math.max(.001,Math.hypot(lm[9].x-wrist.x,lm[9].y-wrist.y)),pinch=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y)/palm,tips=[lm[4],lm[8],lm[12],lm[16],lm[20]];let openness=tips.reduce((s,p)=>s+Math.hypot(p.x-wrist.x,p.y-wrist.y)/palm,0)/5,pointing=lm[8].y<lm[6].y-.018&&lm[12].y>lm[10].y-.002&&lm[16].y>lm[14].y-.002,fingerOpen=clamp((openness-1.12)/.5,0,1),pinchOpen=clamp((pinch-.3)/.65,0,1),targetSpread=Math.max(fingerOpen,pinchOpen*.75);handGestureActive=true;gestureSpread+=(targetSpread-gestureSpread)*.32;closed=gestureSpread<.5;if(pointing){if(!pointingSince)pointingSince=now;if(now-pointingSince>120&&now-lastBurst>850){spawnFirework(1-lm[8].x,lm[8].y);lastBurst=now}}else pointingSince=0;setPointer(1-lm[9].x,lm[9].y,true);document.getElementById('systemStatus').textContent='手势已锁定';if(pointing)setGesture('食指烟花','保持食指伸出即可绽放','✹');else if(closed)setGesture('手掌收合','握拳越紧 · 聚合核心越紧凑','✦');else setGesture('手掌展开','张开越大 · 粒子越发散','✋');});let lastHandFrame=0;const loop=async now=>{if(video.readyState>=2&&now-lastHandFrame>=(mobileMode?42:0)){lastHandFrame=now;await hands.send({image:video});}requestAnimationFrame(loop)};requestAnimationFrame(loop);}catch(err){setGesture('无法启用摄像头','请检查浏览器权限后重试','!');cameraBtn.textContent='摄像头权限被拒绝';}}
    cameraBtn.addEventListener('click',startCamera); addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});makeParticles();render();
  })();
  </script>
